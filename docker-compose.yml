services:
  postgres:
    image: postgres:15-alpine
    container_name: palm_health_db
    restart: always
    environment:
      POSTGRES_DB: palm_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d palm_health"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: palm_health_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: palm_health
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      PGPASSWORD: postgrespassword
      JWT_SECRET: palm_health_secret_jwt_key_2026_super_secure
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
